<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Check-In PWA</title>

  <!-- PWA & Mobile Display Settings -->
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Check-In">

  <!-- Dynamic Web App Manifest (Embedded as Data URI so no extra files needed) -->
  <link rel="manifest" id="manifestPlaceholder">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #000000; /* Pure black for OLED battery preservation */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    .status-btn {
      min-height: 60px;
      font-size: 1.2rem;
      border-width: 2px;
    }
    .card-dark {
      background-color: #121212;
      border: 1px solid #2a2a2a;
    }
    .badge-mesh {
      background-color: #1e3a29;
      color: #3dd68c;
      border: 1px solid #276843;
    }
    .pulse-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #3dd68c;
      margin-right: 6px;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="text-light">

  <div class="container my-3" style="max-width: 500px;">
    
    <!-- System & Connection Header -->
    <header class="d-flex justify-content-between align-items-center p-3 mb-3 card-dark rounded-3">
      <div>
        <h1 class="h6 m-0 fw-bold text-danger">🚨 EMERGENCY CHECK-IN</h1>
        <small class="text-secondary" id="offlineStatus">Status: Offline-Ready (PWA)</small>
      </div>
      <div class="text-end">
        <span class="badge badge-mesh rounded-pill px-2 py-1 mb-1 d-inline-flex align-items-center">
          <span class="pulse-dot"></span>BLE Mesh Ready
        </span>
        <div class="small text-secondary">🔋 Battery: <span class="text-light fw-bold" id="batteryLevel">85%</span></div>
      </div>
    </header>

    <!-- Step 1: Your Current Status Broadcast -->
    <section class="card-dark rounded-3 p-3 mb-3">
      <h2 class="h6 text-uppercase text-secondary fw-bold mb-3">1. Broadcast Your Status</h2>     
      
      <div class="d-grid gap-2 mb-3">
        <button id="btn-safe" type="button" class="btn btn-success status-btn fw-bold text-start px-3 d-flex justify-content-between align-items-center" onclick="selectStatus('SAFE')">
          <span>🟢 I AM SAFE</span>
          <span class="fs-6 text-muted fw-normal" id="label-safe">SELECTED</span>
        </button>

        <button id="btn-help" type="button" class="btn btn-outline-danger status-btn fw-bold text-start px-3 d-flex justify-content-between align-items-center" onclick="selectStatus('NEED HELP')">
          <span>🔴 I NEED HELP</span>
          <span class="fs-6 text-muted fw-normal" id="label-help">Tap to set</span>
        </button>

        <button id="btn-transit" type="button" class="btn btn-outline-warning status-btn fw-bold text-start px-3 d-flex justify-content-between align-items-center" onclick="selectStatus('IN TRANSIT')">
          <span>🟡 IN TRANSIT / RELOCATING</span>
          <span class="fs-6 text-muted fw-normal" id="label-transit">Tap to set</span>
        </button>
      </div>

      <div class="mb-3">
        <label for="statusNote" class="form-label small text-secondary">Optional Short Note / Location</label>
        <input type="text" class="form-control bg-dark text-light border-secondary" id="statusNote" placeholder="e.g. At Chigasaki Primary Shelter">
      </div>

      <button type="button" class="btn btn-primary w-100 py-2 fw-bold" onclick="broadcastStatus()">
        📡 Save & Broadcast Status Packet
      </button>

       <!-- Save & Localstorage Button -->
      <button type="button" class="btn btn-primary w-100 py-2 fw-bold mb-2" onclick="broadcastStatus()">
        📡 Save Status Packet (Offline)
      </button>

      <div class="mb-2">
        <label for="smsRecipient" class="form-label small text-secondary">Family Mobile Number (for SMS)</label>
        <input type="tel" class="form-control bg-dark text-light border-secondary" id="smsRecipient" placeholder="e.g. 09012345678">
        </div>
        
        <!-- NEW: One-Tap SMS Fallback Button -->
      <a id="smsLink" href="#" class="btn btn-outline-info w-100 py-2 fw-bold d-flex align-items-center justify-content-center gap-2">
        💬 Send via SMS Text (Low-Bandwidth)
      </a>

      <div id="broadcastAlert" class="alert alert-success mt-2 py-2 small d-none" role="alert">
        Status saved to offline LocalStorage!
      </div>
    </section>

    <!-- Step 2: Family Status Board -->
    <section class="card-dark rounded-3 p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h6 text-uppercase text-secondary fw-bold m-0">2. Family Board</h2>
        <button class="btn btn-sm btn-outline-secondary py-0" onclick="simulateIncomingPacket()">Simulate Mesh Hop</button>
      </div>

      <div class="list-group list-group-flush" id="familyList">
        <!-- Dynamic content rendered from LocalStorage -->
      </div>
    </section>

    <!-- Technical Packet Preview -->
    <section class="card-dark rounded-3 p-3">
      <h2 class="h6 text-uppercase text-secondary fw-bold mb-2">Technical Packet Payload (JSON)</h2>
      <pre class="bg-black text-success p-2 rounded border border-secondary small mb-0" style="font-size: 0.75rem;" id="rawPayload">
      </pre>
    </section>

  </div>

  <script>
    // ------------------------------------------------------------------
    // A. DYNAMIC PWA MANIFEST CREATION
    // ------------------------------------------------------------------
    const manifestData = {
      "name": "Emergency Check-In App",
      "short_name": "Check-In",
      "start_url": ".",
      "display": "standalone",
      "background_color": "#000000",
      "theme_color": "#000000",
      "icons": [
        {
          "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23dc3545'/><text x='50%' y='65%' font-size='60' text-anchor='middle' fill='white'>🚨</text></svg>",
          "sizes": "192x192 512x512",
          "type": "image/svg+xml"
        }
      ]
    };
    const stringManifest = JSON.stringify(manifestData);
    const blobManifest = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blobManifest);
    document.getElementById('manifestPlaceholder').setAttribute('href', manifestURL);

    // ------------------------------------------------------------------
    // B. SERVICE WORKER REGISTRATION (OFFLINE CACHING)
    // ------------------------------------------------------------------
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'emergency-checkin-v1';
        self.addEventListener('install', (e) => {
          self.skipWaiting();
        });
        self.addEventListener('activate', (e) => {
          e.waitUntil(clients.claim());
        });
        self.addEventListener('fetch', (event) => {
          event.respondWith(
            caches.match(event.request).then((response) => {
              return response || fetch(event.request).catch(() => {
                return caches.match('./');
              });
            })
          );
        });
      `;
      const blobSW = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blobSW);
      navigator.serviceWorker.register(swUrl).then(() => {
        console.log('Service Worker Active - App is 100% Offline Ready!');
      }).catch(err => console.log('SW registration note:', err));
    }

    // ------------------------------------------------------------------
    // C. APP DATA LOGIC (LOCALSTORAGE)
    // ------------------------------------------------------------------
    const DEFAULT_FAMILY = [
      { id: "dad", name: "Taro (Dad)", status: "SAFE", badgeClass: "bg-success", time: "10:18 AM", location: "📍 Chigasaki Elem. Shelter", battery: "88%", via: "Received via: Direct BLE", viaClass: "text-success" },
      { id: "mom", name: "Hanako (Mom)", status: "IN TRANSIT", badgeClass: "bg-warning text-dark", time: "10:05 AM", location: "📍 Moving toward Station", battery: "41%", via: "Received via: Mesh Hop #3", viaClass: "text-warning" },
      { id: "ken", name: "Ken (Brother)", status: "NO SIGNAL", badgeClass: "bg-secondary", time: "08:30 AM", location: "📍 Last known: Home", battery: "95%", via: "Awaiting broadcast...", viaClass: "text-secondary" }
    ];

    let currentStatus = "SAFE";
    let familyData = [];

    function loadData() {
      const savedStatus = localStorage.getItem("my_emergency_status");
      if (savedStatus) {
        const parsed = JSON.parse(savedStatus);
        currentStatus = parsed.status;
        document.getElementById("statusNote").value = parsed.note || "";
      }

      const savedFamily = localStorage.getItem("family_board_status");
      familyData = savedFamily ? JSON.parse(savedFamily) : [...DEFAULT_FAMILY];

      renderBoard();
      updatePayload();
    }

    function saveData() {
      const myPayload = {
        status: currentStatus,
        note: document.getElementById("statusNote").value,
        timestamp: new Date().toISOString()
      };
      localStorage.setItem("my_emergency_status", JSON.stringify(myPayload));
      localStorage.setItem("family_board_status", JSON.stringify(familyData));
    }

    function renderBoard() {
      const list = document.getElementById("familyList");
      list.innerHTML = familyData.map(m => `
        <div class="list-group-item bg-transparent text-light border-secondary px-0 py-2">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <span class="fw-bold fs-6">${m.name}</span>
              <span class="badge ${m.badgeClass} ms-2">${m.status}</span>
            </div>
            <span class="small text-secondary">${m.time}</span>
          </div>
          <div class="small text-secondary mt-1">${m.location} • 🔋 ${m.battery}</div>
          <div class="small ${m.viaClass} mt-1" style="font-size: 0.75rem;">${m.via}</div>
        </div>
      `).join('');
    }

    function selectStatus(status) {
        currentStatus = status;

        // Reset all buttons to outline style
        const btnSafe = document.getElementById('btn-safe');
        const btnHelp = document.getElementById('btn-help');
        const btnTransit = document.getElementById('btn-transit');

        btnSafe.className = 'btn btn-outline-success status-btn fw-bold text-start px-3 d-flex justify-content-between align-items-center';
        btnHelp.className = 'btn btn-outline-danger status-btn fw-bold text-start px-3 d-flex justify-content-between align-items-center';
        btnTransit.className = 'btn btn-outline-warning status-btn fw-bold text-start px-3 d-flex justify-content-between align-items-center';

        document.getElementById('label-safe').innerText = 'Tap to set';
        document.getElementById('label-help').innerText = 'Tap to set';
        document.getElementById('label-transit').innerText = 'Tap to set';

        // Highlight selected button with solid fill
        if (status === 'SAFE') {
            btnSafe.className = 'btn btn-success status-btn fw-bold text-start px-3 d-flex justify-content-between align-items-center';
            document.getElementById('label-safe').innerText = 'SELECTED';
        } else if (status === 'NEED HELP') {
            btnHelp.className = 'btn btn-danger status-btn fw-bold text-start px-3 d-flex justify-content-between align-items-center';
            document.getElementById('label-help').innerText = 'SELECTED';
        } else if (status === 'IN TRANSIT') {
            btnTransit.className = 'btn btn-warning text-dark status-btn fw-bold text-start px-3 d-flex justify-content-between align-items-center';
            document.getElementById('label-transit').innerText = 'SELECTED';
        }

        updatePayload();
        }

    function updatePayload() {
        const noteText = document.getElementById("statusNote").value || "No note";
        const phoneNumber = document.getElementById("smsRecipient").value.trim();
        
        const payload = {
            uid: "usr_self_01",
            status: currentStatus,
            bat: 85,
            ts: new Date().toISOString().substring(11, 19) + "Z",
            note: noteText
        };
        document.getElementById("rawPayload").innerText = JSON.stringify(payload, null, 2);

        // Build SMS draft body
        const smsBody = `[EMERGENCY CHECK-IN]\nStatus: ${currentStatus}\nBattery: 85%\nNote: ${noteText}`;
        const encodedBody = encodeURIComponent(smsBody);

        // Attach phone number if entered
        const smsLink = document.getElementById("smsLink");
        if (phoneNumber) {
            smsLink.href = `sms:${phoneNumber}?body=${encodedBody}`;
        } else {
            smsLink.href = `sms:?body=${encodedBody}`;
        }
        }

    function broadcastStatus() {
      updatePayload();
      saveData();
      const alert = document.getElementById("broadcastAlert");
      alert.classList.remove("d-none");
      setTimeout(() => alert.classList.add("d-none"), 2500);
    }

    function simulateIncomingPacket() {
      const idx = familyData.findIndex(m => m.id === "ken");
      if (idx !== -1) {
        familyData[idx] = {
          id: "ken",
          name: "Ken (Brother)",
          status: "NEED HELP",
          badgeClass: "bg-danger",
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          location: "📍 Near North Gate",
          battery: "12%",
          via: "Received via: Mesh Hop #2",
          viaClass: "text-info"
        };
        saveData();
        renderBoard();
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadData();
      document.getElementById("statusNote").addEventListener("input", () => {
        updatePayload();
        saveData();
      });
    });
  </script>
</body>
</html>
